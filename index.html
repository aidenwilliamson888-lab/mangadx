<!-- ====== JAVASCRIPT - AMBIL DATA DARI MANGADEX API ====== -->
<script>
    const BASE_URL = 'https://api.mangadex.org';

    /**
     * Ambil cover URL dari MangaDex
     * https://api.mangadex.org/docs/03-manga/covers/
     */
    function getCoverUrl(manga) {
        const coverRel = manga.relationships.find(r => r.type === 'cover_art');
        if (!coverRel) return 'https://via.placeholder.com/400x600/1a1a2e/444?text=No+Cover';
        const filename = coverRel.attributes?.fileName;
        if (!filename) return 'https://via.placeholder.com/400x600/1a1a2e/444?text=No+Cover';
        return `https://uploads.mangadex.org/covers/${manga.id}/${filename}.256.jpg`;
    }

    /**
     * Ambil nama author dari manga
     */
    function getAuthor(manga) {
        const authorRel = manga.relationships.find(r => r.type === 'author');
        if (!authorRel) return 'Unknown';
        return authorRel.attributes?.name || 'Unknown';
    }

    /**
     * Ambil judul dalam bahasa Inggris atau default
     */
    function getTitle(manga) {
        const titles = manga.attributes.title;
        return titles.en || Object.values(titles)[0] || 'No Title';
    }

    /**
     * Render manga ke grid
     */
    function renderManga(data) {
        const grid = document.getElementById('mangaGrid');
        if (!data || data.length === 0) {
            grid.innerHTML = `<div class="loading"><p style="color:#888;">Tidak ada manga ditemukan. Coba kata kunci lain.</p></div>`;
            return;
        }

        grid.innerHTML = data.map(manga => {
            const title = getTitle(manga);
            const author = getAuthor(manga);
            const cover = getCoverUrl(manga);
            const chapters = manga.attributes?.lastChapter || '?';
            const status = manga.attributes?.status || 'unknown';

            return `
                <div class="manga-card" onclick="openManga('${manga.id}')">
                    <img class="cover" src="${cover}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x600/1a1a2e/444?text=Error'">
                    <div class="info">
                        <div class="title">${title}</div>
                        <div class="author">Oleh: <strong>${author}</strong></div>
                        <div class="meta">
                            <span>📄 Ch. ${chapters}</span>
                            <span>${status}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    /**
     * Fetch manga dari MangaDex API
     * Endpoint: GET /manga
     * Docs: https://api.mangadex.org/docs/03-manga/search/
     */
    async function fetchManga(query = '') {
        const grid = document.getElementById('mangaGrid');
        grid.innerHTML = `<div class="loading"><div class="spinner"></div><p>Memuat manga...</p></div>`;

        try {
            const params = new URLSearchParams({
                limit: 30,
                includes: 'cover_art,author',
                'order[latestUploadedChapter]': 'desc',
                'contentRating[]': ['safe', 'suggestive', 'erotica'],
                'availableTranslatedLanguage[]': 'en'
            });

            if (query.trim()) {
                params.set('title', query.trim());
            }

            const url = `${BASE_URL}/manga?${params.toString()}`;
            console.log('Fetching:', url);

            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const result = await response.json();
            console.log('Data received:', result.data?.length || 0, 'manga');

            // Filter manga yang punya cover
            const validData = (result.data || []).filter(m => 
                m.relationships.some(r => r.type === 'cover_art')
            );

            renderManga(validData);

        } catch (error) {
            console.error('Error:', error);
            grid.innerHTML = `
                <div class="loading" style="grid-column:1/-1;">
                    <p style="color:#e94560;">❌ Gagal memuat data: ${error.message}</p>
                    <p style="color:#666; font-size:14px; margin-top:8px;">
                        Coba refresh atau cari dengan kata kunci lain.
                    </p>
                </div>
            `;
        }
    }

    /**
     * Fungsi search (dipanggil dari tombol/enter)
     */
    function searchManga() {
        const input = document.getElementById('searchInput');
        fetchManga(input.value);
    }

    /**
     * Fungsi klik manga - arahkan ke fake reader / download
     * Lo bisa ganti URL ini dengan halaman download atau fake reader lo
     */
    function openManga(id) {
        // Redirect ke halaman detail/fake reader
        // Contoh: window.location.href = `read.php?id=${id}`;
        alert(`Buka manga ID: ${id}\nGanti ini dengan link fake reader lo!`);
        // window.location.href = `read.html?id=${id}`;
    }

    // ====== LOAD PERTAMA KALI ======
    document.addEventListener('DOMContentLoaded', () => {
        // Ambil parameter ?search= dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const searchQuery = urlParams.get('search');
        if (searchQuery) {
            document.getElementById('searchInput').value = searchQuery;
            fetchManga(searchQuery);
        } else {
            // Default: trending / latest
            fetchManga('');
        }
    });
</script>
