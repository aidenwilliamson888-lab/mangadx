<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaReader - Read Manga Online Free</title>
    <meta name="description" content="Read manga online for free.">

    <!-- ADS HEADER -->
    <div style="text-align:center; padding:10px 0; background:#f8f9fa; border-bottom:2px solid #dee2e6;">
    </div>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d0d0d; color: #fff; line-height: 1.6; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }
        
        .header { background: #1a1a2e; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e94560; position: sticky; top: 0; z-index: 999; flex-wrap: wrap; gap: 12px; }
        .header .logo { font-size: 22px; font-weight: 800; color: #fff; }
        .header .logo span { color: #e94560; }
        .header .search-box { display: flex; gap: 8px; flex: 1; max-width: 480px; min-width: 180px; }
        .header .search-box input { flex: 1; padding: 10px 18px; border-radius: 30px; border: 2px solid #2a2a4a; background: #12121f; color: #fff; font-size: 14px; outline: none; min-width: 120px; }
        .header .search-box input::placeholder { color: #666; }
        .header .search-box input:focus { border-color: #e94560; }
        .header .search-box button { padding: 10px 24px; border-radius: 30px; border: none; background: #e94560; color: #fff; font-weight: 700; cursor: pointer; font-size: 14px; }
        .header .search-box button:hover { background: #c73a52; }
        
        .ads-sticky { background: #1a1a2e; padding: 12px 10px; text-align: center; border-bottom: 1px solid #2a2a4a; min-height: 80px; position: sticky; top: 70px; z-index: 998; }
        .ads-sticky .ad-label, .ads-inarticle .ad-label { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        
        .container { max-width: 1240px; margin: 0 auto; padding: 20px 15px 60px; }
        
        .ads-inarticle { background: #1a1a2e; padding: 18px 10px; margin: 22px 0; text-align: center; border-radius: 10px; border: 1px solid #2a2a4a; min-height: 90px; }
        
        .filter-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .filter-chips .chip { padding: 6px 18px; border-radius: 30px; border: 1px solid #2a2a4a; background: transparent; color: #aaa; font-size: 13px; cursor: pointer; transition: all 0.3s; }
        .filter-chips .chip:hover, .filter-chips .chip.active { background: #e94560; border-color: #e94560; color: #fff; }
        
        .loading { text-align: center; padding: 60px 0; color: #888; font-size: 18px; grid-column: 1 / -1; }
        .loading .spinner { display: inline-block; width: 44px; height: 44px; border: 4px solid #2a2a4a; border-top: 4px solid #e94560; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* MANGA LIST (TANPA GAMBAR) */
        .manga-list { display: flex; flex-direction: column; gap: 14px; }
        .manga-item { background: #1a1a2e; border-radius: 12px; border: 1px solid #2a2a4a; padding: 20px 24px; transition: all 0.25s; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .manga-item:hover { border-color: #e94560; transform: translateX(5px); box-shadow: 0 5px 25px rgba(233, 69, 96, 0.1); }
        .manga-item .info { flex: 1; min-width: 0; }
        .manga-item .title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 6px; line-height: 1.3; }
        .manga-item .desc { font-size: 14px; color: #aaa; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
        .manga-item .meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: #666; }
        .manga-item .meta span { background: #252540; padding: 3px 12px; border-radius: 12px; }
        .manga-item .arrow { color: #e94560; font-size: 24px; flex-shrink: 0; }
        
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
        .pagination button { padding: 10px 20px; border-radius: 30px; border: 1px solid #2a2a4a; background: transparent; color: #aaa; font-size: 14px; cursor: pointer; }
        .pagination button:hover:not(:disabled) { background: #2a2a4a; color: #fff; }
        .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .footer { text-align: center; padding: 24px 15px; background: #1a1a2e; border-top: 1px solid #2a2a4a; margin-top: 20px; }
        .footer p { color: #555; font-size: 13px; }
        .footer a { color: #e94560; }
        
        @media (max-width: 768px) {
            .header { padding: 12px 16px; flex-direction: column; align-items: stretch; }
            .header .logo { font-size: 20px; text-align: center; }
            .header .search-box { max-width: 100%; }
            .ads-sticky { top: 125px; min-height: 60px; }
            .manga-item { padding: 16px 18px; flex-direction: column; align-items: flex-start; }
            .manga-item .title { font-size: 15px; }
            .manga-item .desc { font-size: 12px; }
            .manga-item .arrow { display: none; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">📖 <span>Manga</span>Reader <small>· Free</small></div>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search manga..." onkeyup="if(event.key==='Enter') searchManga()">
        <button onclick="searchManga()">🔍 Search</button>
    </div>
</header>

<div class="ads-sticky">
    <div class="ad-label">— Advertisement —</div>
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxx" data-ad-slot="xxxx" data-ad-format="auto"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<div class="container">
    <div class="ads-inarticle">
        <script>
  atOptions = {
    'key' : 'c9e60d622e31d7851eafd981db10eaa4',
    'format' : 'iframe',
    'height' : 90,
    'width' : 728,
    'params' : {}
  };
</script>
<script src="https://tuckerclassesjackal.com/c9e60d622e31d7851eafd981db10eaa4/invoke.js"></script>
    </div>

    <div class="filter-chips" id="filterChips">
        <span class="chip active" data-filter="latest" onclick="applyFilter(this, 'latest')">🆕 Latest</span>
        <span class="chip" data-filter="popular" onclick="applyFilter(this, 'popular')">🔥 Popular</span>
    </div>

    <div id="mangaList" class="manga-list">
        <div class="loading"><div class="spinner"></div><p>Loading manga...</p></div>
    </div>

    <div class="pagination" id="pagination">
        <button id="prevPage" onclick="changePage(-1)" disabled>◀ Previous</button>
        <span id="pageInfo" style="color:#666; font-size:14px; padding:8px 0;">Page 1</span>
        <button id="nextPage" onclick="changePage(1)">Next ▶</button>
    </div>

    <div class="ads-inarticle">
        <div class="ad-label">— Advertisement —</div>
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxx" data-ad-slot="xxxx" data-ad-format="auto"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
</div>

<footer class="footer">
    <p>© 2024 <a href="#">MangaReader</a> · Data from MangaDex</p>
</footer>

<script>
    // ====== CONFIGURATION ======
    const WORKER_URL = 'https://mangadxjibex.aidenwilliamson888.workers.dev';
    const MANGADEX_API = 'https://api.mangadex.org';
    
    let currentQuery = '';
    let currentOffset = 0;
    const LIMIT = 20;
    let totalData = 0;
    let currentFilter = 'latest';

    // ====== GET TITLE ======
    function getTitle(manga) {
        const titles = manga.attributes.title;
        return titles.en || Object.values(titles)[0] || 'No Title';
    }

    // ====== GET DESCRIPTION ======
    function getDescription(manga) {
        const desc = manga.attributes.description;
        return desc.en || Object.values(desc)[0] || 'No description available.';
    }

    // ====== GET AUTHOR ======
    function getAuthor(manga) {
        const authorRel = manga.relationships.find(r => r.type === 'author');
        if (!authorRel) return 'Unknown';
        return authorRel.attributes?.name || 'Unknown';
    }

    // ====== GET STATUS ======
    function getStatus(manga) {
        const status = manga.attributes?.status || 'unknown';
        const map = {
            'completed': '✅ Completed',
            'ongoing': '🔄 Ongoing',
            'hiatus': '⏸️ Hiatus',
            'cancelled': '❌ Cancelled'
        };
        return map[status] || status;
    }

    // ====== RENDER MANGA LIST (TANPA GAMBAR) ======
    function renderManga(data) {
        const list = document.getElementById('mangaList');
        if (!data || data.length === 0) {
            list.innerHTML = `
                <div class="loading" style="grid-column:1/-1;">
                    <p style="color:#888;">😕 No manga found</p>
                    <button onclick="resetSearch()" style="margin-top:14px; padding:10px 30px; background:#e94560; color:#fff; border:none; border-radius:30px; font-weight:700; cursor:pointer;">🔄 Reset</button>
                </div>
            `;
            return;
        }

        list.innerHTML = data.map(manga => {
            const title = getTitle(manga);
            const desc = getDescription(manga);
            const author = getAuthor(manga);
            const status = getStatus(manga);
            const chapters = manga.attributes?.lastChapter || '?';

            return `
                <div class="manga-item" onclick="openManga('${manga.id}', '${encodeURIComponent(title)}')">
                    <div class="info">
                        <div class="title">${title}</div>
                        <div class="desc">${desc}</div>
                        <div class="meta">
                            <span>✍️ ${author}</span>
                            <span>📄 Ch. ${chapters}</span>
                            <span>${status}</span>
                        </div>
                    </div>
                    <div class="arrow">▶</div>
                </div>
            `;
        }).join('');
    }

    // ====== FETCH MANGA ======
    async function fetchManga(query = '', offset = 0, filter = 'latest') {
        const list = document.getElementById('mangaList');
        list.innerHTML = `<div class="loading"><div class="spinner"></div><p>Loading manga...</p></div>`;

        try {
            const params = new URLSearchParams();
            params.set('limit', LIMIT.toString());
            params.set('offset', offset.toString());
            params.set('includes[]', 'author');
            params.set('includes[]', 'cover_art');
            params.set('contentRating[]', 'safe');
            params.set('contentRating[]', 'suggestive');

            if (filter === 'popular') {
                params.set('order[followedCount]', 'desc');
            } else {
                params.set('order[latestUploadedChapter]', 'desc');
            }

            if (query && query.trim()) {
                params.set('title', query.trim());
            }

            const targetUrl = `${WORKER_URL}/${encodeURIComponent(`${MANGADEX_API}/manga?${params.toString()}`)}`;
            console.log('🔍 Fetching:', targetUrl);

            const response = await fetch(targetUrl);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const result = await response.json();

            if (result.errors) throw new Error(result.errors[0]?.title || 'API error');

            const validData = result.data || [];
            totalData = result.total || validData.length || 0;

            renderManga(validData);
            updatePagination(offset);

        } catch (error) {
            console.error('❌ Error:', error);
            list.innerHTML = `
                <div class="loading" style="grid-column:1/-1;">
                    <p style="color:#e94560;">❌ Failed to load data</p>
                    <p style="color:#666; font-size:14px;">${error.message}</p>
                    <button onclick="fetchManga('${query}', 0, '${filter}')" 
                            style="margin-top:14px; padding:10px 30px; background:#e94560; color:#fff; border:none; border-radius:30px; font-weight:700; cursor:pointer;">
                        🔄 Try Again
                    </button>
                </div>
            `;
        }
    }

    // ====== PAGINATION ======
    function updatePagination(offset) {
        const currentPage = Math.floor(offset / LIMIT) + 1;
        document.getElementById('pageInfo').textContent = `Page ${currentPage}`;
        document.getElementById('prevPage').disabled = (offset === 0);
        document.getElementById('nextPage').disabled = (offset + LIMIT >= totalData);
    }

    function changePage(direction) {
        const newOffset = currentOffset + (direction * LIMIT);
        if (newOffset < 0) return;
        currentOffset = newOffset;
        fetchManga(currentQuery, currentOffset, currentFilter);
        window.scrollTo({ top: 300, behavior: 'smooth' });
    }

    // ====== SEARCH & FILTER ======
    function searchManga() {
        currentQuery = document.getElementById('searchInput').value.trim();
        currentOffset = 0;
        fetchManga(currentQuery, 0, currentFilter);
    }

    function resetSearch() {
        document.getElementById('searchInput').value = '';
        currentQuery = '';
        currentOffset = 0;
        fetchManga('', 0, currentFilter);
    }

    function applyFilter(element, filter) {
        document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.remove('active'));
        element.classList.add('active');
        currentFilter = filter;
        currentOffset = 0;
        fetchManga(currentQuery, 0, filter);
    }

    // ====== OPEN MANGA → REDIRECT KE READER ======
    function openManga(id, title) {
        window.location.href = `read.html?id=${id}&title=${title}`;
    }

    // ====== INITIAL LOAD ======
    document.addEventListener('DOMContentLoaded', () => {
        fetchManga('', 0, 'latest');
    });
</script>

</body>
</html>
