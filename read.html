<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Manga - MangaReader</title>

    <!-- ADS HEADER -->
    <div style="text-align:center; padding:10px 0; background:#f8f9fa; border-bottom:2px solid #dee2e6;">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxx" data-ad-slot="xxxx" data-ad-format="auto"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d0d0d; color: #fff; line-height: 1.6; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        .header { background: #1a1a2e; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e94560; position: sticky; top: 0; z-index: 999; flex-wrap: wrap; gap: 12px; }
        .header .logo { font-size: 20px; font-weight: 800; color: #fff; cursor: pointer; }
        .header .logo span { color: #e94560; }
        .header .nav { display: flex; gap: 12px; align-items: center; }
        .header .nav a { color: #aaa; font-size: 13px; padding: 6px 16px; border: 1px solid #2a2a4a; border-radius: 30px; transition: all 0.3s; }
        .header .nav a:hover { border-color: #e94560; color: #e94560; }

        .ads-sticky { background: #1a1a2e; padding: 12px 10px; text-align: center; border-bottom: 1px solid #2a2a4a; min-height: 80px; }
        .ads-sticky .ad-label, .ads-inarticle .ad-label { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }

        .container { max-width: 900px; margin: 0 auto; padding: 20px 15px 60px; }

        /* MANGA INFO */
        .manga-info { background: #1a1a2e; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #2a2a4a; }
        .manga-info h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; color: #fff; }
        .manga-info .desc { font-size: 14px; color: #aaa; line-height: 1.7; margin-bottom: 16px; }
        .manga-info .meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: #888; }
        .manga-info .meta span { background: #252540; padding: 4px 14px; border-radius: 12px; }

        /* CHAPTER LIST */
        .chapter-list { background: #1a1a2e; border-radius: 12px; padding: 20px 24px; border: 1px solid #2a2a4a; margin-bottom: 20px; }

        /* 🔥 CHAPTER HEADER + FILTER */
        .chapter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .chapter-header h2 { margin: 0; font-size: 18px; color: #fff; }
        .lang-filter {
            padding: 8px 16px;
            border-radius: 8px;
            border: 2px solid #2a2a4a;
            background: #12121f;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }
        .lang-filter:hover, .lang-filter:focus { border-color: #e94560; }

        .chapter-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-radius: 8px; background: #12121f; margin-bottom: 8px; cursor: pointer; transition: all 0.3s; border: 1px solid transparent; }
        .chapter-item:hover { background: #252540; border-color: #e94560; }
        .chapter-item .ch-title { font-size: 15px; font-weight: 600; color: #fff; }
        .chapter-item .ch-meta { font-size: 12px; color: #666; }
        .chapter-item .ch-arrow { color: #e94560; font-size: 18px; }

        .ads-inarticle { background: #1a1a2e; padding: 18px 10px; margin: 22px 0; text-align: center; border-radius: 10px; border: 1px solid #2a2a4a; min-height: 90px; }

        .loading { text-align: center; padding: 60px 0; color: #888; }
        .loading .spinner { display: inline-block; width: 44px; height: 44px; border: 4px solid #2a2a4a; border-top: 4px solid #e94560; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .btn-back { display: inline-block; padding: 10px 24px; background: #e94560; color: #fff; border-radius: 30px; font-weight: 700; font-size: 14px; margin-bottom: 20px; cursor: pointer; border: none; }
        .btn-back:hover { background: #c73a52; }

        .footer { text-align: center; padding: 24px 15px; background: #1a1a2e; border-top: 1px solid #2a2a4a; margin-top: 20px; }
        .footer p { color: #555; font-size: 13px; }
        .footer a { color: #e94560; }

        @media (max-width: 768px) {
            .manga-info h1 { font-size: 18px; }
            .manga-info .desc { font-size: 13px; }
            .chapter-item { padding: 12px 14px; }
            .chapter-item .ch-title { font-size: 13px; }
            .chapter-header { flex-direction: column; align-items: stretch; }
            .lang-filter { width: 100%; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo" onclick="window.location.href='index.html'">📖 <span>Manga</span>Reader</div>
    <div class="nav">
        <a href="index.html">🏠 Home</a>
    </div>
</header>

<div class="ads-sticky">
    <div class="ad-label">— Advertisement —</div>
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxx" data-ad-slot="xxxx" data-ad-format="auto"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<div class="container">
    <button class="btn-back" onclick="window.location.href='index.html'">← Back to Library</button>

    <div class="ads-inarticle">
        <div class="ad-label">— Advertisement —</div>
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxx" data-ad-slot="xxxx" data-ad-format="auto"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <div id="mangaInfo" class="manga-info">
        <div class="loading"><div class="spinner"></div><p>Loading manga info...</p></div>
    </div>

    <!-- 🔥 CHAPTER LIST DENGAN FILTER -->
    <div id="chapterList" class="chapter-list" style="display:none;">
        <div class="chapter-header">
            <h2>📚 Chapters</h2>
            <select id="langFilter" class="lang-filter" onchange="filterByLang()">
                <option value="">🌐 All Languages</option>
                <option value="en">🇬🇧 English</option>
                <option value="id">🇮🇩 Indonesia</option>
                <option value="es-la">🇲🇽 Spanish (LA)</option>
                <option value="es">🇪🇸 Spanish</option>
                <option value="pt-br">🇧🇷 Portuguese (BR)</option>
                <option value="pt">🇵🇹 Portuguese</option>
                <option value="vi">🇻🇳 Vietnamese</option>
                <option value="th">🇹🇭 Thai</option>
                <option value="ja">🇯🇵 Japanese</option>
                <option value="ko">🇰🇷 Korean</option>
                <option value="zh">🇨🇳 Chinese</option>
                <option value="fr">🇫🇷 French</option>
                <option value="de">🇩🇪 German</option>
            </select>
        </div>
        <div id="chapterItems"></div>
    </div>

    <div class="ads-inarticle">
        <div class="ad-label">— Advertisement —</div>
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxx" data-ad-slot="xxxx" data-ad-format="auto"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
</div>

<footer class="footer">
    <p>© 2024 <a href="index.html">MangaReader</a> · Data from MangaDex</p>
</footer>

<script>
    // ====== CONFIGURATION ======
    const WORKER_URL = 'https://mangadxjibex.aidenwilliamson888.workers.dev';
    const MANGADEX_API = 'https://api.mangadex.org';

    // ====== GET PARAMS ======
    const urlParams = new URLSearchParams(window.location.search);
    const mangaId = urlParams.get('id');
    const mangaTitle = urlParams.get('title') ? decodeURIComponent(urlParams.get('title')) : '';

    // ====== GLOBAL VARIABLES ======
    let allChapters = [];        // 🔥 Simpan semua chapter
    let currentLangFilter = '';  // 🔥 Filter bahasa aktif

    // ====== GET TITLE ======
    function getTitle(manga) {
        const titles = manga.attributes.title;
        return titles.en || Object.values(titles)[0] || 'No Title';
    }

    // ====== GET DESCRIPTION ======
    function getDescription(manga) {
        const desc = manga.attributes.description;
        return desc.en || Object.values(desc)[0] || 'No description available.';
    }

    // ====== GET AUTHOR ======
    function getAuthor(manga) {
        const authorRel = manga.relationships.find(r => r.type === 'author');
        if (!authorRel) return 'Unknown';
        return authorRel.attributes?.name || 'Unknown';
    }

    // ====== GET STATUS ======
    function getStatus(manga) {
        const status = manga.attributes?.status || 'unknown';
        const map = {
            'completed': '✅ Completed',
            'ongoing': '🔄 Ongoing',
            'hiatus': '⏸️ Hiatus',
            'cancelled': '❌ Cancelled'
        };
        return map[status] || status;
    }

    // ====== RENDER MANGA INFO ======
    function renderMangaInfo(manga) {
        const info = document.getElementById('mangaInfo');
        const title = getTitle(manga);
        const desc = getDescription(manga);
        const author = getAuthor(manga);
        const status = getStatus(manga);
        const year = manga.attributes?.year || 'N/A';
        const tags = (manga.attributes?.tags || [])
            .map(t => t.attributes?.name?.en)
            .filter(Boolean)
            .slice(0, 5);

        info.innerHTML = `
            <h1>${title}</h1>
            <div class="desc">${desc}</div>
            <div class="meta">
                <span>✍️ ${author}</span>
                <span>📅 ${year}</span>
                <span>${status}</span>
                ${tags.map(t => `<span>🏷️ ${t}</span>`).join('')}
            </div>
        `;
    }

    // ====== FLAG BAHASA ======
    const langFlags = {
        'en': '🇬🇧', 'id': '🇮🇩', 'es': '🇪🇸', 'es-la': '🇲🇽',
        'pt': '🇵🇹', 'pt-br': '🇧🇷', 'vi': '🇻🇳', 'ja': '🇯🇵',
        'ko': '🇰🇷', 'zh': '🇨🇳', 'fr': '🇫🇷', 'de': '🇩🇪',
        'it': '🇮🇹', 'ru': '🇷🇺', 'ar': '🇸🇦', 'th': '🇹🇭'
    };

    // ====== RENDER CHAPTERS (DENGAN FILTER) ======
    function renderChapters(chapters) {
        const chapterList = document.getElementById('chapterList');
        const chapterItems = document.getElementById('chapterItems');

        // 🔥 SIMPAN SEMUA CHAPTER
        allChapters = chapters || [];

        // 🔥 KALO KOSONG
        if (!allChapters || allChapters.length === 0) {
            chapterItems.innerHTML = `
                <div style="text-align:center; padding:30px 20px;">
                    <p style="color:#888; font-size:16px;">😕 No chapters available</p>
                    <p style="color:#666; font-size:13px; margin-top:8px;">
                        This manga doesn't have any chapters uploaded yet.
                    </p>
                </div>
            `;
            chapterList.style.display = 'block';
            return;
        }

        // 🔥 SORT DARI TERBARU
        allChapters.sort((a, b) => {
            const chA = parseFloat(a.attributes?.chapter) || 0;
            const chB = parseFloat(b.attributes?.chapter) || 0;
            return chB - chA;
        });

        // 🔥 FILTER KALO ADA FILTER BAHASA
        let filtered = allChapters;
        if (currentLangFilter) {
            filtered = allChapters.filter(ch =>
                ch.attributes?.translatedLanguage === currentLangFilter
            );
        }

        // 🔥 KALO HASIL FILTER KOSONG
        if (filtered.length === 0) {
            chapterItems.innerHTML = `
                <div style="text-align:center; padding:30px 20px;">
                    <p style="color:#e94560; font-size:16px;">😕 No chapters in this language</p>
                    <p style="color:#666; font-size:13px; margin-top:8px;">
                        Try selecting another language from the dropdown above.
                    </p>
                    <button onclick="resetLangFilter()" style="margin-top:14px; padding:10px 24px; background:#e94560; color:#fff; border:none; border-radius:30px; font-weight:700; cursor:pointer; font-size:13px;">🌐 Show All Languages</button>
                </div>
            `;
            chapterList.style.display = 'block';
            return;
        }

        // 🔥 RENDER
        chapterItems.innerHTML = filtered.map(ch => {
            const chNum = ch.attributes?.chapter || '?';
            const chTitle = ch.attributes?.title || `Chapter ${chNum}`;
            const chLang = ch.attributes?.translatedLanguage || 'en';
            const chPages = ch.attributes?.pages || 0;
            const chDate = ch.attributes?.publishAt ? new Date(ch.attributes.publishAt).toLocaleDateString() : '';
            const flag = langFlags[chLang] || '🌐';

            return `
                <div class="chapter-item" onclick="openChapter('${ch.id}', '${chNum}')">
                    <div>
                        <div class="ch-title">📖 Ch. ${chNum} — ${chTitle}</div>
                        <div class="ch-meta">${flag} ${chLang.toUpperCase()} · 📄 ${chPages} pages ${chDate ? '· 📅 ' + chDate : ''}</div>
                    </div>
                    <div class="ch-arrow">▶</div>
                </div>
            `;
        }).join('');

        chapterList.style.display = 'block';
        console.log('✅ Rendered', filtered.length, 'of', allChapters.length, 'chapters');
    }

    // ====== FILTER BY LANGUAGE ======
    function filterByLang() {
        const select = document.getElementById('langFilter');
        currentLangFilter = select.value;
        console.log('🌐 Filter by:', currentLangFilter || 'All');
        renderChapters(allChapters);
    }

    // ====== RESET FILTER ======
    function resetLangFilter() {
        document.getElementById('langFilter').value = '';
        currentLangFilter = '';
        renderChapters(allChapters);
    }

    // ====== FETCH MANGA INFO ======
    async function fetchMangaInfo() {
        console.log('🔍 fetchMangaInfo() called');
        console.log('🔍 mangaId:', mangaId);

        if (!mangaId) {
            console.error('❌ mangaId is empty!');
            document.getElementById('mangaInfo').innerHTML = `
                <p style="color:#e94560;">❌ No manga ID provided.</p>
                <button class="btn-back" onclick="window.location.href='index.html'">← Back to Library</button>
            `;
            return;
        }

        try {
            const params = new URLSearchParams();
            params.set('includes[]', 'author');
            params.set('includes[]', 'cover_art');

            const targetUrl = `${WORKER_URL}/${encodeURIComponent(`${MANGADEX_API}/manga/${mangaId}?${params.toString()}`)}`;
            console.log('🔍 Fetching info:', targetUrl);

            const response = await fetch(targetUrl);
            console.log('📡 Response status:', response.status);

            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const result = await response.json();
            console.log('✅ Result:', result);

            if (!result.data) throw new Error('Manga not found');

            renderMangaInfo(result.data);
            console.log('✅ Info rendered, now fetching chapters...');

            fetchChapters();

        } catch (error) {
            console.error('❌ Error:', error);
            document.getElementById('mangaInfo').innerHTML = `
                <p style="color:#e94560;">❌ Failed to load manga info</p>
                <p style="color:#666; font-size:14px;">${error.message}</p>
                <p style="color:#555; font-size:12px; margin-top:8px;">Manga ID: ${mangaId}</p>
                <button onclick="fetchMangaInfo()" style="margin-top:14px; padding:10px 30px; background:#e94560; color:#fff; border:none; border-radius:30px; font-weight:700; cursor:pointer;">🔄 Try Again</button>
            `;
        }
    }

    // ====== FETCH CHAPTERS ======
    async function fetchChapters() {
        // 🔥 RESET FILTER SETIAP GANTI MANGA
        currentLangFilter = '';
        const select = document.getElementById('langFilter');
        if (select) select.value = '';

        try {
            const params = new URLSearchParams();
            params.set('limit', '500');
            params.set('offset', '0');
            params.set('order[chapter]', 'desc');
            params.set('order[volume]', 'desc');
            params.set('contentRating[]', 'safe');
            params.set('contentRating[]', 'suggestive');
            params.set('contentRating[]', 'erotica');

            const targetUrl = `${WORKER_URL}/${encodeURIComponent(`${MANGADEX_API}/manga/${mangaId}/feed?${params.toString()}`)}`;
            console.log('🔍 Fetching chapters:', targetUrl);

            const response = await fetch(targetUrl);
            const result = await response.json();

            console.log('📡 Raw result:', result);

            const chapters = result.data || [];
            console.log('📚 Chapters found:', chapters.length);

            renderChapters(chapters);
        } catch (error) {
            console.error('❌ Error:', error);
            document.getElementById('chapterList').style.display = 'block';
            document.getElementById('chapterItems').innerHTML = `
                <p style="color:#e94560;">❌ Failed to load chapters</p>
                <p style="color:#666; font-size:14px;">${error.message}</p>
                <button onclick="fetchChapters()" style="margin-top:14px; padding:10px 30px; background:#e94560; color:#fff; border:none; border-radius:30px; font-weight:700; cursor:pointer;">🔄 Try Again</button>
            `;
        }
    }

    // ====== OPEN CHAPTER → REDIRECT KE VIEWER ======
    function openChapter(chapterId, chapterNum) {
        window.location.href = `viewer.html?chapter=${chapterId}&manga=${mangaId}&num=${chapterNum}`;
    }

    // ====== INITIAL LOAD ======
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 DOM loaded');
        console.log('🔍 URL:', window.location.href);
        console.log('🔍 Manga ID:', mangaId);

        if (!mangaId) {
            console.error('❌ No manga ID in URL!');
            document.getElementById('mangaInfo').innerHTML = `
                <p style="color:#e94560;">❌ No manga ID provided.</p>
                <p style="color:#666; font-size:13px;">URL harus punya parameter <code>?id=...</code></p>
                <button class="btn-back" onclick="window.location.href='index.html'">← Back to Library</button>
            `;
            return;
        }

        fetchMangaInfo();
    });

    // ====== FALLBACK ======
    window.addEventListener('load', function() {
        console.log('🚀 Window fully loaded');
        setTimeout(function() {
            var info = document.getElementById('mangaInfo');
            if (info && info.innerHTML.includes('Loading manga info')) {
                console.warn('⚠️ Still loading after 3s, retrying...');
                fetchMangaInfo();
            }
        }, 3000);
    });
</script>

</body>
</html>
